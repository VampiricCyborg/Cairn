[project]
name = "cairn"
version = "0.1.0"
description = "Harness-agnostic, git-native memory layer for AI coding agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.5.0",
    "pydantic>=2.13.5",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
cairn = "cairn.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cairn"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["cairn/core"]
strict = true
