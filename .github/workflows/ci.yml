name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Ruff
        run: uv run ruff check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Mypy (cairn/core, strict)
        run: uv run mypy cairn/core

  test:
    # Windows is not optional here. The capture hook was completely broken on
    # Windows -- a .sh file cannot be spawned, so SessionEnd died with EFTYPE --
    # and a Linux-only matrix could not see it. The adapter, the hook probes in
    # `cairn doctor`, and the store's path handling are all platform-sensitive.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Pytest
        run: uv run pytest -q

  opencode-plugin:
    runs-on: ubuntu-latest
    # Type-checks cairn/adapters/opencode/plugin.ts against the real,
    # published @opencode-ai/plugin types -- the "test that fails loudly
    # when the surface moves" the README requires for every adapter.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install adapter devDependencies
        working-directory: cairn/adapters/opencode
        run: npm install
      - name: Typecheck plugin.ts
        working-directory: cairn/adapters/opencode
        run: npm run typecheck
